# LiveKit media server — Die DerDieDas Akademie
# Values in ${...} are filled in by setup.sh from the .env file.
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  # Media over UDP (preferred) …
  port_range_start: 50000
  port_range_end: 60000
  # … and a TCP fallback for students behind strict firewalls.
  tcp_port: 7881
  use_external_ip: true

turn:
  enabled: true
  domain: ${LK_DOMAIN}
  udp_port: 3478

keys:
  ${LK_API_KEY}: ${LK_API_SECRET}

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 60

logging:
  level: info
  json: false
